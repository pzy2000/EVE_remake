name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.1.10f1
  UNITY_ANDROID_IMAGE: unityci/editor:6000.1.10f1-android-3@sha256:ed46b4a1ad2b6c30d752bf2c988b00038ab84551a07625875a34d0d81be71c42
  STARFALL_EMULATOR_ARCH: x86_64

jobs:
  reference-tests:
    name: Reference tests (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0

      - name: Set up JDK 17 for Android policy tests
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17

      - name: Run 71 unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/reference
          node tests/run.mjs | tee artifacts/reference/unit.txt
          grep -Fq 'PASSED: 71  FAILED: 0' artifacts/reference/unit.txt

      - name: Run 21 integration tests
        shell: bash
        run: |
          set -o pipefail
          node tests/integration.mjs | tee artifacts/reference/integration.txt
          grep -Fq 'PASSED: 21  FAILED: 0' artifacts/reference/integration.txt

      - name: Verify universe golden
        shell: bash
        run: |
          set -o pipefail
          node tests/golden-fixture.mjs | tee artifacts/reference/universe-golden.txt
          grep -Fq 'Golden fixture verified:' artifacts/reference/universe-golden.txt

      - name: Validate CI source files
        shell: bash
        run: |
          ruby scripts/validate-workflow-yaml.rb .github/workflows/android.yml
          ruby -c Gemfile
          ruby -c fastlane/Fastfile
          test -s Gemfile.lock
          grep -Fq 'fastlane (= 2.237.0)' Gemfile.lock
          grep -A1 '^BUNDLED WITH$' Gemfile.lock | grep -Fq '2.4.22'
          bash -n scripts/android-assert-clean.sh
          bash -n scripts/android-back-compat-ci.sh
          bash -n scripts/android-build-release.sh
          bash -n scripts/android-check-disk.sh
          bash -n scripts/android-emulator-common.sh
          bash -n scripts/android-emulator-ci.sh
          bash -n scripts/android-java-policy-test.sh
          bash -n scripts/android-stability-ci.sh
          bash -n scripts/test-android-emulator-common.sh
          bash -n scripts/android-verify-unity-results.sh
          bash -n scripts/validate-android-release.sh
          python3 -m py_compile \
            scripts/rewrite-unity-android-paths.py \
            scripts/test-rewrite-unity-android-paths.py
          bash scripts/test-android-emulator-common.sh
          python3 scripts/test-rewrite-unity-android-paths.py
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/android-*.sh scripts/validate-android-release.sh
          fi

      - name: Verify Android Java lifecycle and Back policy
        shell: bash
        run: bash scripts/android-java-policy-test.sh | tee artifacts/reference/android-java-policy.txt

      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-test-results
          path: artifacts/reference
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  unity-android:
    name: Unity tests and x86_64 smoke APK
    needs: reference-tests
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: unity-personal-${{ github.repository }}
      cancel-in-progress: false
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Require Unity license credentials
        shell: bash
        env:
          REQUIRED_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          REQUIRED_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          REQUIRED_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$REQUIRED_UNITY_LICENSE" ]] || missing+=(UNITY_LICENSE)
          [[ -n "$REQUIRED_UNITY_EMAIL" ]] || missing+=(UNITY_EMAIL)
          [[ -n "$REQUIRED_UNITY_PASSWORD" ]] || missing+=(UNITY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Reclaim runner disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Require 25 GiB free
        run: bash scripts/android-check-disk.sh "$GITHUB_WORKSPACE" 25

      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: UnityProject/Library
          key: unity-6000.1.10f1-android-${{ runner.os }}-${{ hashFiles('UnityProject/Packages/manifest.json', 'UnityProject/Packages/packages-lock.json', 'UnityProject/Assets/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            unity-6000.1.10f1-android-${{ runner.os }}-

      - name: Verify clean source before Unity
        run: bash scripts/android-assert-clean.sh

      - name: Run EditMode tests
        id: editmode
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        with:
          projectPath: UnityProject
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: ${{ env.UNITY_ANDROID_IMAGE }}
          testMode: editmode
          artifactsPath: artifacts/unity/editmode

      - name: Verify exact EditMode baseline plus mobile suite
        run: bash scripts/android-verify-unity-results.sh artifacts/unity/editmode EditMode 144

      - name: Run PlayMode tests
        id: playmode
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        with:
          projectPath: UnityProject
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: ${{ env.UNITY_ANDROID_IMAGE }}
          testMode: playmode
          artifactsPath: artifacts/unity/playmode

      - name: Verify exact PlayMode baseline plus mobile suite
        run: bash scripts/android-verify-unity-results.sh artifacts/unity/playmode PlayMode 24

      - name: Compute internal version
        id: version
        shell: bash
        run: |
          version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          version_name="1.0.0-internal.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version_code=$version_code" >>"$GITHUB_OUTPUT"
          echo "version_name=$version_name" >>"$GITHUB_OUTPUT"

      - name: Build experimental smoke APK
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2
        with:
          projectPath: UnityProject
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: ${{ env.UNITY_ANDROID_IMAGE }}
          targetPlatform: Android
          buildsPath: UnityProject/Builds
          buildName: starfall-ci-smoke
          buildMethod: Starfall.Editor.StarfallAndroidBuild.PerformBuild
          versioning: Custom
          version: ${{ steps.version.outputs.version_name }}
          androidVersionCode: ${{ steps.version.outputs.version_code }}
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel36
          customParameters: -starfallBuildFlavor ci-smoke -starfallSmokeArchitecture ${{ env.STARFALL_EMULATOR_ARCH }}

      - name: Verify smoke output
        shell: bash
        run: |
          apk="$(find UnityProject/Builds -type f -name '*.apk' -print -quit)"
          report="$(find UnityProject/Builds -type f -name '*.build-report.json' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          test -n "$report"
          python3 -m json.tool "$report" >/dev/null

      - name: Verify clean source after Unity
        run: bash scripts/android-assert-clean.sh

      - name: Upload Unity tests and smoke APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: starfall-android-ci-smoke-${{ env.STARFALL_EMULATOR_ARCH }}
          path: |
            artifacts/unity
            UnityProject/Builds
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  android-emulator:
    name: API 36 x86_64 emulator acceptance
    needs: unity-android
    if: needs.unity-android.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Download smoke APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: starfall-android-ci-smoke-${{ env.STARFALL_EMULATOR_ARCH }}
          path: downloaded-smoke

      - name: Locate smoke APK
        id: smoke
        shell: bash
        run: |
          apk="$(find downloaded-smoke -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "apk=$apk" >>"$GITHUB_OUTPUT"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run API 36 geometry, lifecycle, and log gates
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: ${{ env.STARFALL_EMULATOR_ARCH }}
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-emulator-ci.sh "${{ steps.smoke.outputs.apk }}" artifacts/android-emulator

      - name: Upload emulator screenshots, layouts, and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-emulator-api36-${{ env.STARFALL_EMULATOR_ARCH }}
          path: artifacts/android-emulator
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  android-back-compat:
    name: API 32 Back compatibility
    needs: unity-android
    if: needs.unity-android.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Download smoke APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: starfall-android-ci-smoke-${{ env.STARFALL_EMULATOR_ARCH }}
          path: downloaded-smoke

      - name: Locate smoke APK
        id: smoke
        shell: bash
        run: |
          apk="$(find downloaded-smoke -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "apk=$apk" >>"$GITHUB_OUTPUT"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Verify API 26-32 Back compatibility on API 32
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 32
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 768M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-back-compat-ci.sh "${{ steps.smoke.outputs.apk }}" artifacts/android-back-compat

      - name: Upload API 32 Back evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-back-compat-api32-x86_64
          path: artifacts/android-back-compat
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  android-release:
    name: Signed ARM64 APK and AAB
    needs:
      - reference-tests
      - unity-android
      - android-emulator
      - android-back-compat
    if: >-
      github.event_name == 'push' &&
      needs.reference-tests.result == 'success' &&
      needs.unity-android.result == 'success' &&
      needs.android-emulator.result == 'success' &&
      needs.android-back-compat.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: unity-personal-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      artifact_name: ${{ steps.release_metadata.outputs.artifact_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Require Unity and Android signing credentials
        shell: bash
        env:
          REQUIRED_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          REQUIRED_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          REQUIRED_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          REQUIRED_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REQUIRED_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REQUIRED_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REQUIRED_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$REQUIRED_UNITY_LICENSE" ]] || missing+=(UNITY_LICENSE)
          [[ -n "$REQUIRED_UNITY_EMAIL" ]] || missing+=(UNITY_EMAIL)
          [[ -n "$REQUIRED_UNITY_PASSWORD" ]] || missing+=(UNITY_PASSWORD)
          [[ -n "$REQUIRED_ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$REQUIRED_ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$REQUIRED_ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$REQUIRED_ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Reclaim runner disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Require 25 GiB free
        run: bash scripts/android-check-disk.sh "$GITHUB_WORKSPACE" 25

      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: UnityProject/Library
          key: unity-6000.1.10f1-release-${{ runner.os }}-${{ hashFiles('UnityProject/Packages/manifest.json', 'UnityProject/Packages/packages-lock.json', 'UnityProject/Assets/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            unity-6000.1.10f1-release-${{ runner.os }}-

      - name: Compute internal version
        id: version
        shell: bash
        run: |
          version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          version_name="1.0.0-internal.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version_code=$version_code" >>"$GITHUB_OUTPUT"
          echo "version_name=$version_name" >>"$GITHUB_OUTPUT"

      - name: Name this attempt's release artifact
        id: release_metadata
        shell: bash
        run: |
          echo "artifact_name=starfall-android-release-${{ steps.version.outputs.version_code }}" \
            >>"$GITHUB_OUTPUT"

      - name: Verify clean source before Unity
        run: bash scripts/android-assert-clean.sh

      - name: Export ARM64 IL2CPP Gradle project
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2
        with:
          projectPath: UnityProject
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: ${{ env.UNITY_ANDROID_IMAGE }}
          targetPlatform: Android
          buildsPath: UnityProject/Builds
          buildName: starfall-release-gradle
          buildMethod: Starfall.Editor.StarfallAndroidBuild.PerformBuild
          versioning: Custom
          version: ${{ steps.version.outputs.version_name }}
          androidVersionCode: ${{ steps.version.outputs.version_code }}
          androidExportType: androidStudioProject
          androidTargetSdkVersion: AndroidApiLevel36
          androidSymbolType: public
          customParameters: -starfallBuildFlavor release-export

      - name: Verify clean source after Unity export
        run: bash scripts/android-assert-clean.sh

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >>"$GITHUB_ENV"

      - name: Install pinned bundletool
        shell: bash
        run: |
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$bundletool"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$bundletool" \
            | shasum -a 256 --check
          echo "BUNDLETOOL_JAR=$bundletool" >>"$GITHUB_ENV"

      - name: Build signed APK and AAB outside Android Studio
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STARFALL_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          STARFALL_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          gradle_root="$(dirname "$(find UnityProject/Builds -type f -name gradlew -print -quit)")"
          test -n "$gradle_root"
          bash scripts/android-build-release.sh "$gradle_root" artifacts/android-release

      - name: Locate release outputs
        id: release
        shell: bash
        run: |
          apk="$(find artifacts/android-release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find artifacts/android-release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"
          echo "apk=$apk" >>"$GITHUB_OUTPUT"
          echo "aab=$aab" >>"$GITHUB_OUTPUT"

      - name: Validate package, APIs, ABI, signatures, bundle, and 16 KiB alignment
        shell: bash
        run: |
          bash scripts/validate-android-release.sh \
            "${{ steps.release.outputs.apk }}" \
            "${{ steps.release.outputs.aab }}" \
            com.pzy.starfallodyssey \
            "${{ steps.version.outputs.version_code }}" \
            "${{ steps.version.outputs.version_name }}" \
            artifacts/android-release/validation

      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd artifacts/android-release
          shasum -a 256 \
            ./*.apk \
            ./*.aab \
            ./*-il2cpp-symbols.zip \
            ./*-il2cpp-symbols.manifest.txt \
            ./BuildReport.json >SHA256SUMS

      - name: Confirm temporary keystore cleanup
        if: always()
        shell: bash
        run: |
          leaked="$(find "$RUNNER_TEMP" -maxdepth 2 -type f -name 'upload.keystore' -print -quit)"
          if [[ -n "$leaked" ]]; then
            echo "Temporary signing keystore was not removed: $leaked" >&2
            exit 1
          fi

      - name: Upload signed release and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.release_metadata.outputs.artifact_name }}
          path: artifacts/android-release
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  github-release:
    name: GitHub Pre-release (signed Android APK)
    needs: android-release
    if: >-
      github.event_name == 'push' &&
      needs.android-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download this attempt's signed Android outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.android-release.outputs.artifact_name }}
          path: downloaded-release

      - name: Verify and publish versioned GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STARFALL_VERSION_CODE: ${{ needs.android-release.outputs.version_code }}
          STARFALL_VERSION_NAME: ${{ needs.android-release.outputs.version_name }}
        run: |
          mapfile -t apks < <(find downloaded-release -type f -name '*.apk' -print)
          mapfile -t aabs < <(find downloaded-release -type f -name '*.aab' -print)
          mapfile -t symbols < <(find downloaded-release -type f -name '*-il2cpp-symbols.zip' -print)
          mapfile -t symbol_manifests < <(find downloaded-release -type f -name '*-il2cpp-symbols.manifest.txt' -print)
          mapfile -t reports < <(find downloaded-release -type f -name BuildReport.json -print)
          mapfile -t checksums < <(find downloaded-release -type f -name SHA256SUMS -print)
          [[ ${#apks[@]} -eq 1 ]] || {
            echo "Expected exactly one signed APK, found ${#apks[@]}" >&2
            exit 1
          }
          [[ ${#aabs[@]} -eq 1 ]] || {
            echo "Expected exactly one signed AAB, found ${#aabs[@]}" >&2
            exit 1
          }
          [[ ${#symbols[@]} -eq 1 ]] || {
            echo "Expected exactly one IL2CPP symbols archive, found ${#symbols[@]}" >&2
            exit 1
          }
          [[ ${#symbol_manifests[@]} -eq 1 ]] || {
            echo "Expected exactly one IL2CPP symbols manifest, found ${#symbol_manifests[@]}" >&2
            exit 1
          }
          [[ ${#reports[@]} -eq 1 ]] || {
            echo "Expected exactly one BuildReport.json, found ${#reports[@]}" >&2
            exit 1
          }
          [[ ${#checksums[@]} -eq 1 ]] || {
            echo "Expected exactly one SHA256SUMS, found ${#checksums[@]}" >&2
            exit 1
          }

          report_version_code="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["versionCode"])' \
            "${reports[0]}")"
          report_version_name="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["versionName"])' \
            "${reports[0]}")"
          [[ "$report_version_code" == "$STARFALL_VERSION_CODE" ]] || {
            echo "BuildReport versionCode does not match the release job output" >&2
            exit 1
          }
          [[ "$report_version_name" == "$STARFALL_VERSION_NAME" ]] || {
            echo "BuildReport versionName does not match the release job output" >&2
            exit 1
          }
          (
            cd "$(dirname "${checksums[0]}")"
            shasum -a 256 --check "$(basename "${checksums[0]}")"
          )

          tag="android-v${STARFALL_VERSION_NAME}"
          validation_archive="$RUNNER_TEMP/${tag}-validation.zip"
          validation_directory="downloaded-release/validation"
          test -d "$validation_directory"
          (
            cd "$validation_directory"
            zip -qry "$validation_archive" .
          )
          notes="$RUNNER_TEMP/${tag}-notes.md"
          cat >"$notes" <<EOF
          Automated signed Android build for commit \`$GITHUB_SHA\`.

          - Version: \`$STARFALL_VERSION_NAME\` (\`$STARFALL_VERSION_CODE\`)
          - Package: \`com.pzy.starfallodyssey\`
          - Runtime: Unity 6000.1.10f1, IL2CPP, ARM64
          - Android: minimum API 26, target API 36
          - Gates: Unity EditMode/PlayMode, API 36 acceptance, API 32 Back compatibility, package/signature/bundle validation

          The APK is the directly installable signed build. The AAB is retained for future Google Play Internal Testing.
          EOF

          assets=(
            "${apks[0]}#Signed ARM64 APK"
            "${aabs[0]}#Signed Android App Bundle"
            "${symbols[0]}#IL2CPP symbols"
            "${symbol_manifests[0]}#IL2CPP symbols manifest"
            "${reports[0]}#Unity BuildReport"
            "${checksums[0]}#SHA-256 checksums"
            "$validation_archive#Android validation evidence"
          )
          if release_json="$(gh release view "$tag" \
            --json assets,isDraft,isPrerelease,targetCommitish)"; then
            release_target="$(jq -r '.targetCommitish' <<<"$release_json")"
            [[ "$release_target" == "$GITHUB_SHA" ]] || {
              echo "Existing release tag $tag targets $release_target, expected $GITHUB_SHA" >&2
              exit 1
            }
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" \
                --target "$GITHUB_SHA" \
                --title "STARFALL ODYSSEY Android $STARFALL_VERSION_NAME" \
                --notes-file "$notes" \
                --prerelease \
                --draft=false
            else
              [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == "true" ]] || {
                echo "Existing release $tag is not a pre-release" >&2
                exit 1
              }
              mapfile -t remote_assets < <(jq -r '.assets[].name' <<<"$release_json")
              for asset in "${assets[@]}"; do
                expected_name="$(basename "${asset%%#*}")"
                printf '%s\n' "${remote_assets[@]}" | grep -Fxq "$expected_name" || {
                  echo "Existing release $tag is missing $expected_name" >&2
                  exit 1
                }
              done
            fi
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "STARFALL ODYSSEY Android $STARFALL_VERSION_NAME" \
              --notes-file "$notes" \
              --prerelease \
              --latest=false
          fi

          gh release view "$tag" \
            --json url,tagName,isPrerelease,targetCommitish \
            --jq '{url,tagName,isPrerelease,targetCommitish}'

  play-internal:
    name: Google Play Internal Testing
    needs: android-release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PLAY_INTERNAL == 'true' &&
      needs.android-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: google-play-internal
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Require Google Play credentials
        shell: bash
        env:
          REQUIRED_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$REQUIRED_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'Missing required GitHub secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON' >&2
            exit 1
          fi

      - name: Download signed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.android-release.outputs.artifact_name }}
          path: downloaded-release

      - name: Set up pinned Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600
        with:
          ruby-version: '3.3'

      - name: Install pinned Fastlane
        run: |
          gem install bundler --version 2.4.22 --no-document
          bundle _2.4.22_ config set deployment true
          bundle _2.4.22_ config set path vendor/bundle
          bundle _2.4.22_ install --jobs 4 --retry 3

      - name: Prepare Play credentials and inputs
        id: play
        shell: bash
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          credential="$RUNNER_TEMP/google-play-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT_JSON" >"$credential"
          ruby -rjson -e 'JSON.parse(File.read(ARGV.fetch(0)))' "$credential"
          mapfile -t aabs < <(find downloaded-release -type f -name '*.aab' -print)
          mapfile -t reports < <(find downloaded-release -type f -name BuildReport.json -print)
          [[ ${#aabs[@]} -eq 1 ]] || {
            echo "Expected exactly one AAB in this attempt's artifact, found ${#aabs[@]}" >&2
            exit 1
          }
          [[ ${#reports[@]} -eq 1 ]] || {
            echo "Expected exactly one BuildReport.json in this attempt's artifact, found ${#reports[@]}" >&2
            exit 1
          }
          aab="${aabs[0]}"
          report="${reports[0]}"
          version_code="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("versionCode")' "$report")"
          [[ "$version_code" == "${{ needs.android-release.outputs.version_code }}" ]] || {
            echo "Release output/report versionCode mismatch" >&2
            exit 1
          }
          {
            echo "GOOGLE_PLAY_JSON_KEY=$credential"
            echo "STARFALL_AAB=$aab"
            echo "STARFALL_VERSION_CODE=$version_code"
            echo "PLAY_EVIDENCE_PATH=$GITHUB_WORKSPACE/play-internal-evidence.json"
          } >>"$GITHUB_ENV"

      - name: Upload to Internal Testing and verify versionCode
        run: bundle _2.4.22_ exec fastlane android internal

      - name: Remove Play credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/google-play-service-account.json"

      - name: Upload Play Internal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: google-play-internal-evidence
          path: play-internal-evidence.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
