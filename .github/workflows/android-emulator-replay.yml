name: Android Emulator Replay
run-name: Replay Android emulators from ${{ inputs.source_run }}

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Android CI run ID or full 40-character commit SHA
        required: true
        type: string
      script_ref:
        description: Optional ref containing newer emulator scripts; APK remains frozen
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: android-emulator-replay-${{ inputs.source_run }}-${{ inputs.script_ref || 'apk-source' }}
  cancel-in-progress: false

env:
  STARFALL_EMULATOR_ARCH: x86_64

jobs:
  resolve-source:
    name: Resolve retained smoke APK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve source run and smoke artifact
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]; then
            run_id="$SOURCE_RUN"
          elif [[ "$SOURCE_RUN" =~ ^[0-9a-fA-F]{40}$ ]]; then
            source_sha="$(tr '[:upper:]' '[:lower:]' <<<"$SOURCE_RUN")"
            run_id="$(
              gh api --paginate --slurp \
                "repos/$REPOSITORY/actions/workflows/android.yml/runs?per_page=100" \
                | jq -r --arg sha "$source_sha" \
                  '[.[].workflow_runs[] | select(.head_sha == $sha)]
                   | sort_by(.run_number, .run_attempt) | last | .id // empty'
            )"
          else
            echo 'source_run must be a numeric run ID or full 40-character commit SHA.' >&2
            exit 2
          fi
          [[ -n "$run_id" ]] || {
            echo "No Android CI run was found for $SOURCE_RUN." >&2
            exit 1
          }

          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
          workflow_name="$(jq -r '.name' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          [[ "$workflow_name" == 'Android CI' ]] || {
            echo "Run $run_id belongs to $workflow_name, not Android CI." >&2
            exit 1
          }
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Run $run_id has an invalid head SHA: $head_sha" >&2
            exit 1
          }

          artifact_count="$(
            gh api "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(
                .name == "starfall-android-ci-smoke-x86_64" and .expired == false
              )] | length'
          )"
          [[ "$artifact_count" == '1' ]] || {
            echo "Run $run_id has $artifact_count retained x86_64 smoke artifacts; expected one." >&2
            exit 1
          }

          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >>"$GITHUB_OUTPUT"
          {
            echo '### Emulator replay source'
            echo "- Android CI run: $run_id"
            echo "- APK commit: $head_sha"
            echo "- Script ref: ${{ inputs.script_ref || 'same as APK commit' }}"
            echo '- APK: retained `starfall-android-ci-smoke-x86_64` artifact'
          } >>"$GITHUB_STEP_SUMMARY"

  replay-api36-scenarios:
    name: API 36 / ${{ matrix.slug }}
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - slug: compact-vulkan
            scenario: 2748x1172-420-vulkan-preferred
          - slug: square-vulkan
            scenario: 2480x2200-420-vulkan-preferred
          - slug: vertical-hinge
            scenario: 2480x2200-420-vertical-hinge
          - slug: horizontal-half-opened
            scenario: 2480x2200-420-horizontal-half-opened
          - slug: compact-gles3
            scenario: 2748x1172-420-gles3
          - slug: compact-320dpi
            scenario: 2748x1172-320-geometry
          - slug: square-560dpi
            scenario: 2480x2200-560-geometry
    steps:
      - name: Check out emulator scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.script_ref || needs.resolve-source.outputs.head_sha }}
          persist-credentials: false

      - name: Download retained smoke APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: starfall-android-ci-smoke-${{ env.STARFALL_EMULATOR_ARCH }}
          path: downloaded-smoke
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-source.outputs.run_id }}

      - name: Locate smoke APK
        id: smoke
        shell: bash
        run: |
          apk="$(find downloaded-smoke -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          echo "apk=$apk" >>"$GITHUB_OUTPUT"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          if [[ ! -c /dev/kvm ]]; then
            sudo modprobe kvm || true
            sudo modprobe kvm_intel || true
          fi
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for _ in {1..30}; do
            [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]] && exit 0
            sleep 1
          done
          ls -l /dev/kvm || true
          lsmod | grep -E '^kvm' || true
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Replay selected API 36 scenario
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          STARFALL_ANDROID_SUITE: scenarios
          STARFALL_ANDROID_SCENARIOS: ${{ matrix.scenario }}
        with:
          api-level: 36
          target: default
          arch: ${{ env.STARFALL_EMULATOR_ARCH }}
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          heap-size: 1024M
          disk-size: 12G
          emulator-build: 15004761
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-emulator-ci.sh "${{ steps.smoke.outputs.apk }}" artifacts/android-emulator

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-replay-api36-${{ matrix.slug }}-${{ needs.resolve-source.outputs.run_id }}
          path: artifacts/android-emulator
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  replay-api36-lifecycle:
    name: API 36 / lifecycle and stability
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Check out emulator scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.script_ref || needs.resolve-source.outputs.head_sha }}
          persist-credentials: false

      - name: Download retained smoke APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: starfall-android-ci-smoke-${{ env.STARFALL_EMULATOR_ARCH }}
          path: downloaded-smoke
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-source.outputs.run_id }}

      - name: Locate smoke APK
        id: smoke
        shell: bash
        run: |
          apk="$(find downloaded-smoke -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          echo "apk=$apk" >>"$GITHUB_OUTPUT"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          if [[ ! -c /dev/kvm ]]; then
            sudo modprobe kvm || true
            sudo modprobe kvm_intel || true
          fi
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for _ in {1..30}; do
            [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]] && exit 0
            sleep 1
          done
          ls -l /dev/kvm || true
          lsmod | grep -E '^kvm' || true
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Replay API 36 lifecycle and stability
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          STARFALL_ANDROID_SUITE: lifecycle
        with:
          api-level: 36
          target: default
          arch: ${{ env.STARFALL_EMULATOR_ARCH }}
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          heap-size: 1024M
          disk-size: 12G
          emulator-build: 15004761
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-emulator-ci.sh "${{ steps.smoke.outputs.apk }}" artifacts/android-lifecycle

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-replay-api36-lifecycle-${{ needs.resolve-source.outputs.run_id }}
          path: artifacts/android-lifecycle
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  replay-api32-back:
    name: API 32 / Back compatibility
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out emulator scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.script_ref || needs.resolve-source.outputs.head_sha }}
          persist-credentials: false

      - name: Download retained smoke APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: starfall-android-ci-smoke-${{ env.STARFALL_EMULATOR_ARCH }}
          path: downloaded-smoke
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-source.outputs.run_id }}

      - name: Locate smoke APK
        id: smoke
        shell: bash
        run: |
          apk="$(find downloaded-smoke -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          echo "apk=$apk" >>"$GITHUB_OUTPUT"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          if [[ ! -c /dev/kvm ]]; then
            sudo modprobe kvm || true
            sudo modprobe kvm_intel || true
          fi
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for _ in {1..30}; do
            [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]] && exit 0
            sleep 1
          done
          ls -l /dev/kvm || true
          lsmod | grep -E '^kvm' || true
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Replay API 32 Back compatibility (attempt 1)
        id: api32_attempt_1
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 32
          target: default
          arch: ${{ env.STARFALL_EMULATOR_ARCH }}
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          heap-size: 768M
          disk-size: 8G
          emulator-build: 15004761
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-back-compat-ci.sh "${{ steps.smoke.outputs.apk }}" artifacts/android-back-compat

      - name: Clear failed API 32 replay evidence
        if: steps.api32_attempt_1.outcome == 'failure'
        shell: bash
        run: |
          if [[ -d artifacts/android-back-compat ]]; then
            find artifacts/android-back-compat -mindepth 1 -delete
          fi

      - name: Retry API 32 Back compatibility replay
        id: api32_attempt_2
        if: steps.api32_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 32
          target: default
          arch: ${{ env.STARFALL_EMULATOR_ARCH }}
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          heap-size: 768M
          disk-size: 8G
          emulator-build: 15004761
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-back-compat-ci.sh "${{ steps.smoke.outputs.apk }}" artifacts/android-back-compat

      - name: Require a successful API 32 replay attempt
        if: always()
        shell: bash
        env:
          ATTEMPT_1: ${{ steps.api32_attempt_1.outcome }}
          ATTEMPT_2: ${{ steps.api32_attempt_2.outcome }}
        run: |
          if [[ "$ATTEMPT_1" != success && "$ATTEMPT_2" != success ]]; then
            echo "Both API 32 replay attempts failed: first=$ATTEMPT_1 second=$ATTEMPT_2" >&2
            exit 1
          fi

      - name: Upload API 32 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-replay-api32-back-${{ needs.resolve-source.outputs.run_id }}
          path: artifacts/android-back-compat
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  enforce-replay:
    name: Enforce complete replay inventory
    if: always()
    needs:
      - resolve-source
      - replay-api36-scenarios
      - replay-api36-lifecycle
      - replay-api32-back
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish and enforce replay results
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.resolve-source.result }}
          SCENARIO_RESULT: ${{ needs.replay-api36-scenarios.result }}
          LIFECYCLE_RESULT: ${{ needs.replay-api36-lifecycle.result }}
          API32_RESULT: ${{ needs.replay-api32-back.result }}
          SOURCE_RUN_ID: ${{ needs.resolve-source.outputs.run_id }}
        run: |
          {
            echo '### Emulator replay inventory'
            echo "- Source resolution: $SOURCE_RESULT"
            echo "- API 36 scenario matrix: $SCENARIO_RESULT"
            echo "- API 36 lifecycle/stability: $LIFECYCLE_RESULT"
            echo "- API 32 Back: $API32_RESULT"
            echo "- Frozen APK run: $SOURCE_RUN_ID"
            echo '- Exact scenario failures are listed as independent matrix jobs.'
          } >>"$GITHUB_STEP_SUMMARY"
          [[ "$SOURCE_RESULT" == 'success' ]]
          [[ "$SCENARIO_RESULT" == 'success' ]]
          [[ "$LIFECYCLE_RESULT" == 'success' ]]
          [[ "$API32_RESULT" == 'success' ]]
